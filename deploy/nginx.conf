server {
    listen 80;
    listen [::]:80;
    server_name 13.207.211.164;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://13.207.211.164$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 13.207.211.164;
    ssl_certificate /etc/letsencrypt/live/petfood-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/petfood-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/petfood/current;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 16k;
        proxy_read_timeout 60s;
    }
    location / { try_files $uri $uri/ =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
